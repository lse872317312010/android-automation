plugins { id 'com.android.application' }
android {
    namespace 'dev.androidautomation.harness'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.androidautomation.harness'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.2-milestone'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/milestoneAssets')
    sourceSets.androidTest.assets.srcDir layout.buildDirectory.dir('generated/contractAssets')
    packaging.resources.excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
}
dependencies {
    implementation files('libs/autojs6-rhino.jar')
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
def repoRoot = rootProject.projectDir.parentFile
tasks.register('stageContractAssets', Sync) {
    from(new File(repoRoot, 'test/runtime')) { include 'host-fixture.js', 'case-runner.js', 'cases.json' }
    from(new File(repoRoot, 'dist')) { include 'AndroidAutomation.js' }
    into layout.buildDirectory.dir('generated/contractAssets')
}
tasks.configureEach {
    if (name == 'mergeDebugAndroidTestAssets') dependsOn 'stageContractAssets'
}

tasks.register('stageMilestoneAssets', Sync) {
    from(new File(repoRoot, 'dist')) { include 'AndroidAutomation.js' }
    into layout.buildDirectory.dir('generated/milestoneAssets')
}
tasks.configureEach {
    if (name == 'mergeDebugAssets') dependsOn 'stageMilestoneAssets'
}
