name: Android milestone APK and emulator contracts
on:
  pull_request:
    paths: ['android-harness/**', 'tool/test-rhino.mjs', 'tool/verify-android-results.py', 'test/android_results_test.py', 'test/runtime/**', 'src/**', 'dist/**', '.github/workflows/android-contract.yml']
  push:
    branches: ['main']
    paths: ['android-harness/**', 'tool/test-rhino.mjs', 'tool/verify-android-results.py', 'test/android_results_test.py', 'test/runtime/**', 'src/**', 'dist/**', '.github/workflows/android-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test native evidence validator
        run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: Verify pinned engine and prepare test-only dependency
        run: |
          node tool/test-rhino.mjs
          mkdir -p android-harness/app/libs
          cp .cache/rhino/autojs6-rhino.jar android-harness/app/libs/autojs6-rhino.jar
      - name: Build instrumentation harness before booting emulator
        run: gradle -p android-harness :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable hosted runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p android-harness :app:connectedDebugAndroidTest --stacktrace
      - name: Require complete native JUnit evidence
        env:
          EVIDENCE_COMMIT: ${{ github.sha }}
        run: |
          python3 tool/verify-android-results.py \
            --results android-harness/app/build/outputs/androidTest-results/connected \
            --bundle dist/AndroidAutomation.js --commit "$EVIDENCE_COMMIT" --api 30 \
            --output test-results/android-framework.json
      - name: Package milestone APK and provenance
        env:
          MILESTONE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p milestone
          cp android-harness/app/build/outputs/apk/debug/app-debug.apk milestone/AndroidAutomation-milestone.apk
          cp dist/AndroidAutomation.js milestone/AndroidAutomation.js
          cp test-results/android-framework.json milestone/
          printf '%s\n' "$MILESTONE_COMMIT" > milestone/COMMIT.txt
          printf '%s\n' 'Debug-signed milestone: manual fixture + script export. AutoJs6 runtime still required.' 'Not Redmi/game verified. Debug signing is ephemeral; later builds may require reinstall.' > milestone/README.txt
          (cd milestone && sha256sum AndroidAutomation-milestone.apk AndroidAutomation.js android-framework.json COMMIT.txt README.txt > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAutomation-milestone-${{ github.sha }}
          path: milestone/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-framework-contract-${{ github.sha }}
          path: |
            android-harness/app/build/reports/androidTests
            android-harness/app/build/outputs/androidTest-results
            test-results/rhino.json
            test-results/android-framework.json
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish tested milestone APK Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: framework
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AndroidAutomation-milestone-${{ github.sha }}
          path: release-assets
      - name: Publish immutable milestone release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: milestone-${{ github.sha }}
        run: |
          gh release create "$RELEASE_TAG" \\
            release-assets/AndroidAutomation-milestone.apk \\
            release-assets/AndroidAutomation.js \\
            release-assets/android-framework.json \\
            release-assets/COMMIT.txt \\
            release-assets/SHA256SUMS \\
            release-assets/README.txt \\
            --repo "$GITHUB_REPOSITORY" --prerelease \\
            --title "Android Automation milestone ${GITHUB_SHA:0:12}" \\
            --notes "CI-tested milestone APK for commit $GITHUB_SHA. Verify SHA256SUMS. Debug signature; reinstall may be required for later milestones. This is not Redmi or live-game verified."
