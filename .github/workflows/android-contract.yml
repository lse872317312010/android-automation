name: Android framework contracts (emulator, no device input)
on:
  pull_request:
    paths: ['android-harness/**', 'test/runtime/**', 'src/**', 'dist/**', '.github/workflows/android-contract.yml']
  push:
    branches: ['main', 'test/android-framework-harness']
    paths: ['android-harness/**', 'test/runtime/**', 'src/**', 'dist/**', '.github/workflows/android-contract.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-contract-${{ github.ref }}
  cancel-in-progress: true
jobs:
  framework:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify pinned engine and prepare test-only dependency
        run: |
          node tool/test-rhino.mjs
          mkdir -p android-harness/app/libs
          cp .cache/rhino/autojs6-rhino.jar android-harness/app/libs/autojs6-rhino.jar
      - name: Build instrumentation harness before booting emulator
        run: gradle -p android-harness :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Enable hosted runner KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle -p android-harness :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-framework-contract-${{ github.sha }}
          path: |
            android-harness/app/build/reports/androidTests
            android-harness/app/build/outputs/androidTest-results
            test-results/rhino.json
          if-no-files-found: warn
          retention-days: 14
