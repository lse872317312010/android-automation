name: Android Automation - required quality gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Node ${{ matrix.node }} / policy + simulator
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test native evidence validator
        run: python3 -m unittest discover -s test -p '*_test.py' -v
      - name: Verify source/builder JavaScript syntax
        run: |
          node --check src/core.js
          node --check src/skill-contract.js
          node --check src/android.js
          node --check build.mjs
          node --check test/core.test.cjs
          node --check test/invariants.test.cjs
          node --check test/host.test.cjs
          node --check test/acceptance.test.cjs
          node --check test/skill-manifest.test.cjs
          node --check tool/validate-acceptance.cjs
          node --check tool/validate-skill-manifest.cjs
          node --check tool/test-rhino.mjs
          node --check tool/mutation-check.mjs
          node --check test/runtime.test.cjs
          node --check test/runtime/host-fixture.js
          node --check test/runtime/case-runner.js
      - name: Unit, contract and seeded failure-injection tests
        run: |
          mkdir -p test-results
          node --test --test-reporter=spec --test-reporter=junit \
            --test-reporter-destination=stdout \
            --test-reporter-destination=test-results/junit.xml test/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-test-results-node-${{ matrix.node }}-${{ github.sha }}
          path: test-results/junit.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Prove critical regressions are detected (Node 22)
        if: matrix.node == 22
        run: node tool/mutation-check.mjs
      - uses: actions/upload-artifact@v4
        if: always() && matrix.node == 22
        with:
          name: mutation-sensitivity-${{ github.sha }}
          path: test-results/mutations.json
          retention-days: 14
      - name: Assert draft example cannot be executed
        run: |
          node -e "const m=require('./examples/starrail-skill-manifest.example.json'); if(m.skill.executionEnabled!==false || m.skill.status!=='draft' || m.execution.inputBudget.maxActions!==0) process.exit(1)"
          node tool/validate-skill-manifest.cjs examples/starrail-skill-manifest.example.json
      - name: Rebuild distributable from reviewed source
        run: node build.mjs
      - name: Verify generated script is syntactically valid
        run: node --check dist/AndroidAutomation.js
      - name: Reject stale or manually edited generated artifact
        run: git diff --exit-code -- dist/AndroidAutomation.js
      - name: Mandatory coverage gate (pure policy, Node 22)
        if: matrix.node == 22
        run: |
          node --experimental-test-coverage --test \
            --test-coverage-include=src/core.js \
            --test-coverage-lines=100 \
            --test-coverage-branches=90 \
            --test-coverage-functions=100 \
            test/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: AndroidAutomation-script-${{ github.sha }}
          path: dist/AndroidAutomation.js
          retention-days: 14
  rhino:
    name: AutoJs6 6.7.0 Rhino / inert host
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Run shipped bundle on pinned AutoJs6 engine
        run: node tool/test-rhino.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rhino-inert-runtime-${{ github.sha }}
          path: test-results/rhino.json
          retention-days: 14
