name: Android visual loop policy
on:
  pull_request:
    paths: ['src/**', 'test/**', 'dist/**', 'build.mjs', '.github/workflows/ci.yml']
  push:
    paths: ['src/**', 'test/**', 'dist/**', 'build.mjs', '.github/workflows/ci.yml']
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/core.test.cjs
      - run: node build.mjs
      - run: node --check dist/AndroidAutomation.js
      - run: git diff --exit-code -- dist
      - uses: actions/upload-artifact@v4
        with:
          name: AndroidAutomation-script
          path: dist/AndroidAutomation.js
